name: CI/CD srtrikeforce

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v3

      - name: build image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/strikeforcev1:latest .

      - name: docker hub login
        run: |
          echo ${{ secrets.DOCKER_PAT }} | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: push image to docker hub
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/strikeforcev1:latest

      - name: deploy to ec2
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.EC2_HOST }}
          port: 22
          username: ec2-user
          key: ${{ secrets.EC2_SECRET }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/strikeforcev1:latest
            docker stop strikeforcev1 || true 
            docker rm strikeforcev1 || true 
            docker run -d \
            --name strikeforcev1 \
            -p 3003:3000 \
            -e SECRET_KEY=${{ secrets.SECRET_KEY }} \
            -e APP_PORT=3000 \
            -e NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }} \
            -e DB_NAME=${{ secrets.DB_NAME }} \
            -e DB_USER=${{ secrets.DB_USER }} \
            -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
            -e DB_PORT=${{ secrets.DB_PORT }} \
            -e DB_HOST=${{ secrets.DB_HOST }} \
            -e MAILJET_KEY=${{ secrets.MAILJET_KEY }} \
            -e MAILJET_SECRET=${{ secrets.MAILJET_SECRET }} \
            -e MAILJET_EMAIL=${{ secrets.MAILJET_EMAIL }} \
            -e MAILJET_FROM=${{ secrets.MAILJET_FROM }} \
            --restart always \
            ${{ secrets.DOCKER_USERNAME }}/strikeforcev1:latest
